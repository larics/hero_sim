# collision_avoid: ported from agilex_sitl hero_sitl/config/collision_avoid.yaml.
# All keys, and the sim: block defaults, are documented in example.yaml.

ground_robots:
  - name: scout_1
    pose: {x: 0.0, y: 0.0, yaw: 0.0}
    drive: omni
    model: scout
  - name: herover_1
    pose: {x: -3.5, y: -0.0, yaw: 0.0}
    drive: omni
    model: herover
  - name: herover_2
    pose: {x: -3.0, y: -3.0, yaw: 0.0}
    drive: omni
    model: herover
  - name: herover_3
    pose: {x: 0.0, y: -3.5, yaw: 0.0}
    drive: omni
    model: herover

crazyflies:
  - pose: {x: 3.5, y: 0.0, z: 0.03}   # cf_1
  - pose: {x: 3.0, y: 3.0, z: 0.03}   # cf_2
  - pose: {x: 0.0, y: 3.5, z: 0.03}   # cf_3
