# Tether demo: winch -> UGV pulley -> UAV ring -> object on the floor.
# Get the object into the goal circle. It slides on the floor, never lifts,
# and jams if pulled into the pillar: route it around. The pillar blocks the
# robots too, the drone at any height.
#
#   bash start.sh tether_demo.yaml      # sim + RViz
#
# Controls: /herover_1/cmd_vel, /cf_1/takeoff|go_to|land, /winch/cmd_rate (m/s, + out, - in).
# Feedback: /tether/object_pose, /tether/goal, /tether/taut, /tether/free_length,
#           /tether/stuck, /tether/goal_reached, /winch/length, /hero_sim/obstacles.
#           See README "Tether task".

ground_robots:
  - name: herover_1
    pose: {x: -1.5, y: -1.5, yaw: 0.0}
    drive: omni
    model: herover

crazyflies:
  - pose: {x: 0.0, y: 1.0, z: 0.03}   # cf_1

tether:
  winch: {x: -3.0, y: 0.0, z: 0.3}    # m, where the tether leaves the drum
  ugv: herover_1                       # pulley on its deck (pose z)
  uav: cf_1                            # guide ring
  object: {x: 0.5, y: -0.5}            # start on the floor
  object_size: 0.3                     # m, cube
  goal: {x: 2.5, y: 1.5, radius: 0.4}
  slack: 3.0                           # m of tether beyond taut at the start
  max_reel_speed: 0.5                  # m/s

obstacles:                             # pillars: block the object and the robots
  - {x: 1.5, y: 0.5, radius: 0.35}     # right on the straight line to the goal

sim:
  map: null
  collision: true
