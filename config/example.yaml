# hero_sim scenario: every supported key, with defaults.
# Copy this file to make a new scenario. Unknown keys are rejected at launch.

# Kinematic ground robots. Each one subscribes to /<name>/cmd_vel (body-frame
# Twist, held until the next message) and publishes /<name>/pose plus TF
# world -> <name> at the pose's z.
#   pose: {z: 0.227}   height (m) of the published pose: where the mocap markers sit on
#                  the real robot. Default by model, the top of its deck: scout 0.227,
#                  herover 0.095, no model 0. The mesh stays on the floor either way
#   drive: omni    holonomic, honors linear.x, linear.y and angular.z (default)
#   drive: diff    non-holonomic, linear.y is ignored
#   model: scout | herover   RViz mesh drawn on the robot's frame; leave out for TF axes only
#   radius: 0.42   footprint (m) kept out of map obstacles (see sim.collision). Default
#                  by model: scout 0.42, herover 0.17, no model 0.3. 0 ignores the map
ground_robots:
  - name: scout_1
    pose: {x: 0.0, y: 0.0, yaw: 0.0}   # m, m, rad
    drive: omni
    model: scout
  - name: herover_1
    pose: {x: 0.0, y: 0.6, yaw: 0.0}
    drive: diff
    model: herover

# Crazyflies, named cf_1, cf_2, ... in list order (reordering renumbers them).
# Same topics/services as crazyswarm2's crazyflie_server, plus /all/* broadcasts.
#   gripper: true   starts with an open two-claw gripper on top, drawn in RViz
#                   (default false). Needs sim_attach (see attach below), which
#                   shuts it on a branch lock and serves /sim/<cf>/add_gripper.
#   radius: 0.1     footprint (m) kept out of map obstacles (default 0.1)
crazyflies:
  - pose: {x: 1.5, y:  0.5, z: 0.03}   # cf_1
    gripper: true
  - pose: {x: 1.5, y: -0.5, z: 0.03}   # cf_2

# Optional. Leave out any key to keep its default.
sim:
  ground_rate: 50.0          # Hz, ground robot integration + /pose rate
  ground_max_speed: 2.0      # m/s, clamp on |(linear.x, linear.y)|
  ground_max_yaw_rate: 2.0   # rad/s, clamp on |angular.z|
  cf_rate: 10.0              # Hz, Crazyflie update + /pose rate
  cf_battery_drain: 0.025    # V/s while flying (starts 4.2 V, floors at 3.0 V)
  attach: auto               # sim_attach (/sim/attach_agent dock ride-along): auto runs it
                             # only if hero_mrs_msgs is installed; true | false to force
  rviz: true                 # RViz with config/sim.rviz
  models: true               # robot meshes in RViz (crazyflies, and ground robots with a model)
  map: icuas26_1             # octomap: maps/<name>.bt, a path to a .bt, or null for none
  collision: true            # robots stop where their footprint would hit a map obstacle
  collision_z: [0.2, 2.0]    # m, map heights that count as obstacles, flattened to 2D:
                             # trunks and posts, not the floor, ceiling or tree canopies
