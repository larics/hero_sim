<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50,0 L0,0 L0,50" fill="none" stroke="#dee2e6" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#868e96" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-size="36" font-weight="bold" fill="#212529">Tethered Object Transport <tspan font-weight="normal" fill="#868e96">(top view)</tspan></text>
  <text x="40" y="92" font-size="20" fill="#495057">One winch, one UGV, one UAV, one tether. Slide the object across the floor, around the pillar, into the goal.</text>

  <!-- Floor -->
  <rect x="40" y="115" width="1110" height="760" rx="10" fill="#f8f9fa"/>
  <rect x="40" y="115" width="1110" height="760" rx="10" fill="url(#grid)" stroke="#adb5bd" stroke-width="2"/>
  <g transform="translate(75,840)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#c92a2a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#2b8a3e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="58" y="6" font-size="16" fill="#c92a2a">x</text>
    <text x="-5" y="-58" font-size="16" fill="#2b8a3e">y</text>
  </g>

  <!-- Goal zone -->
  <circle cx="960" cy="250" r="95" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="850" y="200" font-size="24" font-weight="bold" fill="#2b8a3e" text-anchor="end">GOAL</text>

  <!-- Pillar -->
  <circle cx="790" cy="420" r="55" fill="#e9ecef"/>
  <circle cx="790" cy="420" r="55" fill="url(#hatch)" stroke="#495057" stroke-width="3"/>
  <text x="790" y="356" font-size="18" font-weight="bold" fill="#495057" text-anchor="middle">pillar</text>

  <!-- Straight pull: blocked -->
  <line x1="625" y1="538" x2="712" y2="463" stroke="#e03131" stroke-width="3" stroke-dasharray="8 6"/>
  <g stroke="#e03131" stroke-width="5" stroke-linecap="round">
    <line x1="706" y1="447" x2="726" y2="467"/>
    <line x1="726" y1="447" x2="706" y2="467"/>
  </g>
  <text x="640" y="452" font-size="18" font-weight="bold" fill="#e03131" text-anchor="end">straight pull jams</text>

  <!-- Route around: 1 then 2 -->
  <line x1="640" y1="512" x2="968" y2="512" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="3 8" marker-end="url(#arrowG)"/>
  <circle cx="805" cy="512" r="13" fill="#2b8a3e"/><text x="805" y="518" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <path d="M1000,500 C995,430 985,380 968,330" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="3 8" marker-end="url(#arrowG)"/>
  <circle cx="1010" cy="420" r="13" fill="#2b8a3e"/><text x="1010" y="426" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>

  <!-- UAV ghost over the goal (step 2) -->
  <g opacity="0.35">
    <line x1="925" y1="215" x2="995" y2="285" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
    <line x1="995" y1="215" x2="925" y2="285" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
    <circle cx="925" cy="215" r="20" fill="#b197fc"/><circle cx="995" cy="215" r="20" fill="#b197fc"/>
    <circle cx="925" cy="285" r="20" fill="#b197fc"/><circle cx="995" cy="285" r="20" fill="#b197fc"/>
    <rect x="946" y="236" width="28" height="28" rx="6" fill="#5f3dc4"/>
  </g>
  <text x="1070" y="245" font-size="16" fill="#5f3dc4">then</text>
  <text x="1070" y="265" font-size="16" fill="#5f3dc4">fly here</text>

  <!-- Tether: winch -> UGV pulley -> UAV ring -> object -->
  <polyline points="185,470 430,740 1000,560 600,560" fill="none" stroke="#e8590c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Winch (W) -->
  <rect x="90" y="430" width="95" height="80" rx="8" fill="#495057"/>
  <rect x="110" y="442" width="55" height="56" rx="6" fill="#868e96"/>
  <line x1="118" y1="442" x2="118" y2="498" stroke="#e8590c" stroke-width="4"/>
  <line x1="128" y1="442" x2="128" y2="498" stroke="#e8590c" stroke-width="4"/>
  <line x1="138" y1="442" x2="138" y2="498" stroke="#e8590c" stroke-width="4"/>
  <line x1="148" y1="442" x2="148" y2="498" stroke="#e8590c" stroke-width="4"/>
  <line x1="158" y1="442" x2="158" y2="498" stroke="#e8590c" stroke-width="4"/>
  <text x="137" y="415" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">W</text>
  <text x="137" y="540" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Winch (fixed)</text>
  <text x="137" y="563" font-size="15" fill="#495057" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">/winch/cmd_rate</text>

  <!-- UGV (G), top view -->
  <rect x="380" y="708" width="100" height="64" rx="12" fill="#364fc7"/>
  <rect x="382" y="697" width="26" height="13" rx="3" fill="#212529"/>
  <rect x="452" y="697" width="26" height="13" rx="3" fill="#212529"/>
  <rect x="382" y="770" width="26" height="13" rx="3" fill="#212529"/>
  <rect x="452" y="770" width="26" height="13" rx="3" fill="#212529"/>
  <circle cx="430" cy="740" r="14" fill="#fff" stroke="#212529" stroke-width="4"/>
  <line x1="498" y1="740" x2="555" y2="740" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="800" x2="430" y2="845" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="355" y="735" font-size="26" font-weight="bold" fill="#364fc7" text-anchor="end">G</text>
  <text x="580" y="790" font-size="20" font-weight="bold" fill="#212529">UGV herover_1</text>
  <text x="580" y="814" font-size="17" fill="#495057">moving pulley on its deck</text>
  <text x="580" y="838" font-size="15" fill="#495057" font-family="DejaVu Sans Mono, monospace">/herover_1/cmd_vel</text>

  <!-- UAV (A), top view: step 1, beside the pillar -->
  <line x1="955" y1="515" x2="1045" y2="605" stroke="#343a40" stroke-width="7" stroke-linecap="round"/>
  <line x1="1045" y1="515" x2="955" y2="605" stroke="#343a40" stroke-width="7" stroke-linecap="round"/>
  <circle cx="955" cy="515" r="24" fill="#b197fc" opacity="0.85"/>
  <circle cx="1045" cy="515" r="24" fill="#b197fc" opacity="0.85"/>
  <circle cx="955" cy="605" r="24" fill="#b197fc" opacity="0.85"/>
  <circle cx="1045" cy="605" r="24" fill="#b197fc" opacity="0.85"/>
  <rect x="982" y="542" width="36" height="36" rx="7" fill="#5f3dc4"/>
  <circle cx="1000" cy="560" r="10" fill="#fff" stroke="#212529" stroke-width="4"/>
  <text x="1080" y="575" font-size="26" font-weight="bold" fill="#5f3dc4">A</text>
  <text x="1010" y="662" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">UAV cf_1</text>
  <text x="1010" y="685" font-size="17" fill="#495057" text-anchor="middle">flying pulley</text>
  <text x="1010" y="707" font-size="15" fill="#495057" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">/cf_1/go_to</text>

  <!-- Object (O), on the floor -->
  <rect x="570" y="530" width="60" height="60" rx="6" fill="#b08968" stroke="#7f5539" stroke-width="4"/>
  <line x1="570" y1="560" x2="630" y2="560" stroke="#7f5539" stroke-width="2"/>
  <line x1="600" y1="530" x2="600" y2="590" stroke="#7f5539" stroke-width="2"/>
  <text x="555" y="575" font-size="26" font-weight="bold" fill="#7f5539" text-anchor="end">O</text>
  <text x="600" y="620" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Object</text>
  <text x="600" y="642" font-size="15" fill="#495057" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">/tether/object_pose</text>

  <!-- Segment labels -->
  <text x="268" y="640" font-size="20" fill="#d9480f" font-style="italic" text-anchor="end">d₁ = |W − G|</text>
  <text x="770" y="700" font-size="20" fill="#d9480f" font-style="italic">d₂ = |G − A|</text>
  <text x="900" y="550" font-size="22" fill="#d9480f" font-style="italic" font-weight="bold">l</text>

  <!-- How it works -->
  <rect x="1175" y="115" width="385" height="390" rx="12" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <text x="1198" y="152" font-size="22" font-weight="bold" fill="#212529">How the tether works</text>
  <text x="1198" y="188" font-size="18" fill="#212529">The object stays on the floor.</text>
  <text x="1198" y="212" font-size="18" fill="#212529">It can only be <tspan font-weight="bold">pulled</tspan>, never lifted.</text>
  <text x="1198" y="252" font-size="18" fill="#212529">Tether paid out by the winch: <tspan font-weight="bold">L</tspan></text>
  <text x="1198" y="290" font-size="21" fill="#d9480f" font-weight="bold">l = L − |W−G| − |G−A|</text>
  <text x="1198" y="314" font-size="16" fill="#495057">free tether from the UAV to the object</text>
  <text x="1198" y="354" font-size="18" fill="#212529">• Slack: object stays put</text>
  <text x="1198" y="388" font-size="18" fill="#212529">• Taut: slides <tspan font-weight="bold">straight toward</tspan></text>
  <text x="1216" y="412" font-size="18" fill="#212529">the point under the UAV</text>
  <text x="1198" y="446" font-size="18" fill="#e03131">• Pulled into the pillar: it jams.</text>
  <text x="1216" y="470" font-size="18" fill="#e03131">Go around it in steps</text>

  <!-- Controls -->
  <rect x="1175" y="525" width="385" height="350" rx="12" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <text x="1198" y="562" font-size="22" font-weight="bold" fill="#212529">Your controls</text>
  <text x="1198" y="602" font-size="19" fill="#364fc7" font-weight="bold">1. Drive the UGV</text>
  <text x="1220" y="626" font-size="16" fill="#495057">sets where the tether bends</text>
  <text x="1198" y="666" font-size="19" fill="#5f3dc4" font-weight="bold">2. Fly the UAV</text>
  <text x="1220" y="690" font-size="16" fill="#495057">sets the pull direction</text>
  <text x="1198" y="730" font-size="19" fill="#e8590c" font-weight="bold">3. Turn the winch</text>
  <text x="1220" y="754" font-size="16" fill="#495057">reel in (pull) / pay out (slack)</text>
  <line x1="1198" y1="780" x2="1537" y2="780" stroke="#e9ecef" stroke-width="2"/>
  <text x="1198" y="815" font-size="19" font-weight="bold" fill="#2b8a3e">Goal: object inside the</text>
  <text x="1198" y="841" font-size="19" font-weight="bold" fill="#2b8a3e">green circle</text>
</svg>
